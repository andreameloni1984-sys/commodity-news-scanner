name: DAY RESEARCH

on:
  schedule:
    # ogni ora dalle 07:00 alle 20:00 ora di Roma (05:00-18:00 UTC in inverno)
    - cron: "0 5-18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    name: DAY TRADING RESEARCH NOTES
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run day research
        run: python engine/day_research.py

      - name: Persist research snapshot off main
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          cp data/day_research.json "$output"
          branch="research/day-research-notes"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout --orphan "$branch"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p data
          cp "$output" data/day_research.json
          git add data/day_research.json
          if git diff --cached --quiet; then
            echo "No changes to research snapshot"
          else
            git commit -m "research: update day notes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin "HEAD:$branch"
          fi
