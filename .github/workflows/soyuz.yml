name: SOYUZ GAGARIN

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:

  soyuz:

    name: SOYUZ GAGARIN ENGINE

    runs-on: ubuntu-latest

    env:

      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ENABLED: "1"
      SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
      T212_API_KEY: ${{ secrets.T212_API_KEY }}
      T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
      PAPER_TRADING_ONLY: "1"
      MIN_ENTRY_PROBABILITY: "68"
      MIN_ENTRY_QUALITY: "60"
      MIN_ENTRY_CONFIDENCE: "65"
      MIN_ENTRY_RR: "2.5"
      MAX_ENTRY_STOP_ATR: "2.5"
      SL_STRUCTURE_BUFFER_ATR: "0.15"
      SL_MIN_ATR: "0.80"
      MONITOR_INTERVAL_MINUTES: "15"
      POLITICAL_IMPACT_ENABLED: "1"
      US_PRESIDENT_IMPACT_ENABLED: "1"
      ELECTION_IMPACT_ENABLED: "1"
      FUTURES_STRUCTURE_ENABLED: "1"
      WEATHER_ENABLED: "1"
      DISASTER_ENABLED: "1"
      CFTC_ENABLED: "1"
      EIA_ENABLED: "1"
      SOLE24_ENABLED: "1"
      GAGARIN_FOREX_ON_DEMAND: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Environment check
        run: |
          echo "=============================================="
          echo "SOYUZ GAGARIN ENVIRONMENT"
          echo "=============================================="
          python --version
          if [ -z "$TWELVE_DATA_API_KEY" ]; then
            echo "TWELVE_DATA_API_KEY MISSING"
            exit 1
          fi
          echo "TWELVE_DATA_API_KEY PRESENT"
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN MISSING"
            exit 1
          fi
          echo "TELEGRAM_BOT_TOKEN PRESENT"
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID MISSING"
            exit 1
          fi
          echo "TELEGRAM_CHAT_ID PRESENT"
          if [ -z "$T212_API_KEY" ]; then
            echo "T212_API_KEY MISSING"
          else
            echo "T212_API_KEY PRESENT"
          fi
          if [ -z "$T212_API_SECRET" ]; then
            echo "T212_API_SECRET MISSING"
          else
            echo "T212_API_SECRET PRESENT"
          fi
          echo "PAPER_TRADING_ONLY=$PAPER_TRADING_ONLY"

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest -q tests/
          else
            echo "No tests directory."
          fi

      - name: Check agriculture diagnostic
        run: |
          if [ -f "diagnostic_agri.py" ]; then
            echo "diagnostic_agri.py FOUND"
          else
            echo "diagnostic_agri.py NOT FOUND"
            exit 1
          fi

      - name: Agriculture diagnostic
        run: python diagnostic_agri.py

      - name: Run SOYUZ GAGARIN
        run: python main.py

      - name: Final status
        if: always()
        run: |
          echo "SOYUZ GAGARIN RUN FINISHED"
          echo "PAPER_TRADING_ONLY=$PAPER_TRADING_ONLY"
