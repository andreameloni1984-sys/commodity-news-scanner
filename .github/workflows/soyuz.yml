name: SOYUZ GAGARIN

on:
  workflow_dispatch:

  schedule:
    # Ogni 15 minuti
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:

  soyuz:

    name: SOYUZ GAGARIN ENGINE

    runs-on: ubuntu-latest

    env:

      # ==================================================
      # API / TELEGRAM
      # ==================================================

      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      TELEGRAM_ENABLED: "1"


      # ==================================================
      # TRADING MODE
      # ==================================================

      PAPER_TRADING_ONLY: "1"


      # ==================================================
      # GAGARIN ENTRY GATES
      # ==================================================

      MIN_ENTRY_PROBABILITY: "62"

      MIN_ENTRY_QUALITY: "55"

      MIN_ENTRY_CONFIDENCE: "60"

      MIN_ENTRY_RR: "2.5"


      # ==================================================
      # RISK MANAGEMENT
      # ==================================================

      MAX_ENTRY_STOP_ATR: "2.5"

      SL_STRUCTURE_BUFFER_ATR: "0.15"

      SL_MIN_ATR: "0.80"


      # ==================================================
      # MONITOR
      # ==================================================

      MONITOR_INTERVAL_MINUTES: "15"


      # ==================================================
      # POLITICAL / MACRO INTELLIGENCE
      # ==================================================

      POLITICAL_IMPACT_ENABLED: "1"

      US_PRESIDENT_IMPACT_ENABLED: "1"

      ELECTION_IMPACT_ENABLED: "1"


      # ==================================================
      # MARKET INTELLIGENCE
      # ==================================================

      FUTURES_STRUCTURE_ENABLED: "1"

      WEATHER_ENABLED: "1"

      DISASTER_ENABLED: "1"

      CFTC_ENABLED: "1"

      EIA_ENABLED: "1"

      SOLE24_ENABLED: "1"


    steps:


      # ==================================================
      # 1 — CHECKOUT
      # ==================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ==================================================
      # 2 — PYTHON
      # ==================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

          cache: "pip"


      # ==================================================
      # 3 — INSTALL DEPENDENCIES
      # ==================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then

            pip install -r requirements.txt

          else

            pip install requests

          fi


      # ==================================================
      # 4 — CHECK ENVIRONMENT
      # ==================================================

      - name: Environment check

        run: |

          echo "=============================================="

          echo "SOYUZ GAGARIN ENVIRONMENT"

          echo "=============================================="

          python --version

          echo ""

          if [ -n "$TWELVE_DATA_API_KEY" ]; then

            echo "TWELVE_DATA_API_KEY: PRESENT"

          else

            echo "TWELVE_DATA_API_KEY: MISSING"

            exit 1

          fi

          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then

            echo "TELEGRAM_BOT_TOKEN: PRESENT"

          else

            echo "TELEGRAM_BOT_TOKEN: MISSING"

          fi

          if [ -n "$TELEGRAM_CHAT_ID" ]; then

            echo "TELEGRAM_CHAT_ID: PRESENT"

          else

            echo "TELEGRAM_CHAT_ID: MISSING"

          fi

          echo ""

          echo "PAPER_TRADING_ONLY=$PAPER_TRADING_ONLY"

          echo "MONITOR_INTERVAL_MINUTES=$MONITOR_INTERVAL_MINUTES"

          echo "=============================================="


      # ==================================================
      # 5 — PYTHON COMPILE CHECK
      # ==================================================

      - name: Compile Python

        run: |

          echo "=============================================="

          echo "PYTHON COMPILE CHECK"

          echo "=============================================="

          python -m compileall -q .

          echo "COMPILE: OK"


      # ==================================================
      # 6 — TEST SUITE
      # ==================================================

      - name: Run tests

        run: |

          echo "=============================================="

          echo "PYTEST"

          echo "=============================================="

          if [ -d "tests" ]; then

            python -m pytest -q tests/

          else

            echo "No tests directory."

            echo "Tests skipped."

          fi


      # ==================================================
      # 7 — AGRICULTURE DIAGNOSTIC
      # ==================================================

      - name: Agriculture diagnostic

        run: |

          echo "=============================================="

          echo "AGRICULTURE DATA DIAGNOSTIC"

          echo "=============================================="

          echo ""

          if [ -f "diagnostic_agri.py" ]; then

            python diagnostic_agri.py

          else

            echo "ERROR: diagnostic_agri.py NOT FOUND"

            exit 1

          fi


      # ==================================================
      # 8 — SOYUZ GAGARIN
      # ==================================================

      - name: Run SOYUZ GAGARIN

        run: |

          echo "=============================================="

          echo "SOYUZ GAGARIN"

          echo "DATA -> REGIME -> STRUCTURE -> SETUP -> TRIGGER -> RISK -> SAFETY"

          echo "=============================================="

          echo ""

          python main.py


      # ==================================================
      # 9 — FINAL STATUS
      # ==================================================

      - name: Final status

        if: always()

        run: |

          echo ""

          echo "=============================================="

          echo "SOYUZ GAGARIN RUN FINISHED"

          echo "=============================================="

          echo "PAPER_TRADING_ONLY=$PAPER_TRADING_ONLY"

          echo "No real orders are allowed."

          echo "=============================================="