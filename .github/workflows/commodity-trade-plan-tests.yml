name: Commodity trade-plan tests

on:
  push:
    branches: [main]
    paths:
      - "soyuz_gagarin/commodity_trade_plan.py"
      - "soyuz_gagarin/adapter.py"
      - "soyuz_gagarin/risk_governor.py"
      - "soyuz_gagarin/models.py"
      - "tests/test_commodity_trade_plan.py"
      - "tests/test_gagarin_core.py"
      - "engine/feedback.py"
      - "main.py"
      - "tests/test_feedback_outcomes.py"
      - ".github/workflows/commodity-trade-plan-tests.yml"
  pull_request:
    paths:
      - "soyuz_gagarin/commodity_trade_plan.py"
      - "soyuz_gagarin/adapter.py"
      - "soyuz_gagarin/risk_governor.py"
      - "soyuz_gagarin/models.py"
      - "engine/feedback.py"
      - "main.py"
      - "tests/test_commodity_trade_plan.py"
      - "tests/test_gagarin_core.py"
      - "tests/test_feedback_outcomes.py"
      - ".github/workflows/commodity-trade-plan-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"
      - name: Compile changed modules
        run: python -m py_compile soyuz_gagarin/commodity_trade_plan.py soyuz_gagarin/adapter.py engine/feedback.py main.py tests/test_commodity_trade_plan.py tests/test_gagarin_core.py tests/test_feedback_outcomes.py
      - name: Test commodity bracket and Gagarin governor
        run: python -m pytest -q tests/test_commodity_trade_plan.py tests/test_gagarin_core.py tests/test_feedback_outcomes.py
