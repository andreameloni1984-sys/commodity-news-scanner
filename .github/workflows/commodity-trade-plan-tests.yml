name: Commodity trade-plan tests

on: {}
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"
      - name: Compile changed modules
        run: python -m py_compile soyuz_gagarin/commodity_trade_plan.py soyuz_gagarin/adapter.py engine/feedback.py main.py telegram/render_runner.py tests/test_commodity_trade_plan.py tests/test_gagarin_core.py tests/test_feedback_outcomes.py
      - name: Test commodity bracket and Gagarin governor
        run: python -m pytest -q tests/test_commodity_trade_plan.py tests/test_gagarin_core.py tests/test_feedback_outcomes.py
