name: SOYUZ Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "soyuz_motors.py"
      - "soyuz_adapter.py"
      - "tests/**"
      - ".github/workflows/soyuz-tests.yml"

jobs:
  test-soyuz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run SOYUZ tests
        run: python -m pytest -q tests/