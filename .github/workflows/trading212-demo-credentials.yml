name: Trading 212 Demo credential presence (no orders)
on:
  workflow_dispatch:
  push:
    branches:
      - rewrite/clean-invest-v2
    paths:
      - '.github/workflows/trading212-demo-credentials.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEY_A: ${{ secrets.TRADING212_API_KEY != '' }}
      KEY_B: ${{ secrets.TRADING_212_API_KEY != '' }}
      KEY_C: ${{ secrets.TRADING212_DEMO_API_KEY != '' }}
      SECRET_A: ${{ secrets.TRADING212_API_SECRET != '' }}
      SECRET_B: ${{ secrets.TRADING212_DEMO_API_SECRET != '' }}
    steps:
      - name: Check known secret names without printing values
        run: |
          python - <<'PY'
          import os
          names = {
              'TRADING212_API_KEY': 'KEY_A',
              'TRADING_212_API_KEY': 'KEY_B',
              'TRADING212_DEMO_API_KEY': 'KEY_C',
              'TRADING212_API_SECRET': 'SECRET_A',
              'TRADING212_DEMO_API_SECRET': 'SECRET_B',
          }
          for name, flag in names.items():
              print(f"{name}: {'configured' if os.environ.get(flag) == 'true' else 'not detected'}")
          print("No API request or order was sent.")
          PY
