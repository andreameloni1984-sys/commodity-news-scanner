name: Gagarin NEWS alert tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-news-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9" "requests>=2.31,<3"
      - name: Compile Python modules
        run: python -m py_compile engine/data.py engine/research_controls.py engine/research_statistics.py engine/mtf_roles.py engine/gagarin.py engine/feedback.py engine/alert_review_scheduler.py telegram/aggressive_alert.py telegram/news_monitor.py telegram/bot.py telegram/render_runner.py research/intraday_windows.py
      - name: Test research controls, quote semantics, bootstrap validation, news monitor and Telegram
        run: python -m pytest -q tests/test_research_controls.py tests/test_mtf_roles.py tests/test_research_statistics.py tests/test_quote_semantics.py tests/test_news_monitor.py tests/test_telegram_minimal_menu.py tests/test_intraday_windows.py tests/test_pattern_exit.py tests/test_aggressive_opportunity_alert.py tests/test_alert_review.py
