name: GAGARIN Telegram menu tests

on:
  pull_request:
    paths:
      - "telegram/bot.py"
      - "tests/test_telegram_menu.py"
      - ".github/workflows/gagarin_menu_tests.yml"
  push:
    branches: [main]
    paths:
      - "telegram/bot.py"
      - "tests/test_telegram_menu.py"
      - ".github/workflows/gagarin_menu_tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_telegram_menu.py -v
