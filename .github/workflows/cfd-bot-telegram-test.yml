name: Gagarin CFD Bot - messaggio di test Telegram
on:
  push:
    branches: [claude/commodities-analysis-bot-chat-cywpjt]
    paths: [".github/workflows/cfd-bot-telegram-test.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-message:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ACCOUNT_SIZE: ${{ vars.ACCOUNT_SIZE }}
      RISK_PCT: ${{ vars.RISK_PCT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python -m cfdbot.telegram_test
