name: Gagarin Execution Layer Tests

on:
  push:
  pull_request:

jobs:
  test-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run execution safety tests
        run: pytest -q tests/test_execution_layer.py
