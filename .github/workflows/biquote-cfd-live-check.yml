name: BiQuote CFD Live Feed Check

on:
  push:
    branches:
      - "gagarin/biquote-cfd-reference-channel"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-feed:
    name: Verify public BiQuote CFD quotes and M5 candles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install requests
      - name: Probe BiQuote live CFD feed
        run: python scripts/check_biquote_cfd_feed.py
