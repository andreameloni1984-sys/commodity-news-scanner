name: INVEST v2 unit tests
on:
  workflow_dispatch:
  push:
    branches:
      - rewrite/clean-invest-v2
  pull_request:
    paths:
      - 'invest_v2/**'
      - 'tests/**'
      - '.github/workflows/invest-v2-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lightweight INVEST v2 syntax and import smoke check
        run: |
          python -m compileall -q invest_v2
          python - <<'PY'
          import invest_v2.research_runner
          import invest_v2.delivery_state
          import invest_v2.sec_ticker
          print('INVEST v2 imports OK; no network, orders or Telegram calls')
          PY
