name: SOYUZ Telegram Listener

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions esegue il listener ogni 5 minuti.
    # Ogni esecuzione resta in ascolto per circa 19 minuti.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: soyuz-telegram-listener
  cancel-in-progress: false

jobs:
  telegram:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:

      # ==========================================================
      # TELEGRAM
      # ==========================================================

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      TELEGRAM_POLL_TIMEOUT: "15"
      TELEGRAM_LISTENER_MAX_SECONDS: "1140"
      TELEGRAM_ANALYSIS_TIMEOUT: "900"

      # ==========================================================
      # MARKET DATA
      # ==========================================================

      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

      SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
      SIFTING_BASE_URL: https://api.sifting.io

      SIFTING_LIVE_ENABLED: "1"
      SIFTING_LIVE_REQUIRED: "0"
      SIFTING_LIVE_MAX_AGE_SECONDS: "30"
      SIFTING_TIMEOUT_SECONDS: "8"
      SIFTING_MAX_LIVE_QUOTES_PER_RUN: "6"

      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      # ==========================================================
      # TRADING SAFETY
      # ==========================================================

      PAPER_TRADING_ONLY: "1"
      DEMO_TRADING_ENABLED: "0"

      # ==========================================================
      # MONITORING
      # ==========================================================

      MONITOR_INTERVAL_MINUTES: "15"
      MONITOR_SEND_FULL: "0"

      SILENT_INTERNAL_ANALYSIS: "1"
      EVENT_ALERTS_ENABLED: "0"

      # ==========================================================
      # ENTRY GATES
      # ==========================================================

      MIN_ENTRY_PROBABILITY: "62"
      MIN_ENTRY_QUALITY: "55"
      MIN_ENTRY_CONFIDENCE: "60"

      MIN_ENTRY_RR: "2.5"
      MIN_ENTRY_RR_TP1: "1.5"
      MIN_ENTRY_RR_TP2: "2.0"
      MIN_ENTRY_RR_TP3: "2.5"

      MAX_ENTRY_STOP_ATR: "2.5"
      SL_STRUCTURE_BUFFER_ATR: "0.15"
      SL_MIN_ATR: "0.80"

      # ==========================================================
      # GAGARIN
      # ==========================================================

      GAGARIN_FINAL_AUTHORITY: "1"
      GAGARIN_REQUIRE_LIVE_FOR_ENTRY: "1"

      # ==========================================================
      # KNOWLEDGE
      # ==========================================================

      KNOWLEDGE_ENGINE_V5_ENABLED: "1"
      PRE_USA_ENGINE_ENABLED: "1"
      LONG_TERM_ENABLED: "1"
      INTRADAY_JOURNAL_ALL: "1"

      # ==========================================================
      # MARKET INTELLIGENCE
      # ==========================================================

      MARKET_INTELLIGENCE_ENABLED: "1"
      EXTERNAL_INTELLIGENCE_ENABLED: "1"

      POLITICAL_IMPACT_ENABLED: "1"
      GEOPOLITICAL_IMPACT_ENABLED: "1"

      COMMODITY_FUNDAMENTALS_ENABLED: "1"
      MARKET_REGIME_ENABLED: "1"
      CROSS_COMMODITY_ANALYSIS_ENABLED: "1"
      VOLATILITY_CONTEXT_ENABLED: "1"

      FUTURES_STRUCTURE_ENABLED: "1"

      CFTC_ENABLED: "1"
      EIA_ENABLED: "1"
      WEATHER_ENABLED: "1"
      DISASTER_ENABLED: "1"

      SOLE24_ENABLED: "1"

      # ==========================================================
      # OPPORTUNITIES / SCALPING
      # ==========================================================

      EARLY_OPPORTUNITY_ENABLED: "1"
      SCALPING_ENABLED: "1"

      # ==========================================================
      # SOCIAL INTELLIGENCE
      # ==========================================================

      SOYUZ_SOCIAL_INTELLIGENCE_ENABLED: "1"

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests pandas numpy feedparser

          pip install youtube-transcript-api==1.2.4


      # ==========================================================
      # VERIFY FILES
      # ==========================================================

      - name: Verify Telegram listener

        run: |

          test -f telegram_listener.py

          test -f commodity_bot.py

          test -f soyuz_motors.py

          test -f soyuz_adapter.py

          test -f soyuz_shadow_integration.py


      # ==========================================================
      # COMPILE CHECK
      # ==========================================================

      - name: Verify Python files

        run: |

          python -m py_compile telegram_listener.py

          python -m py_compile commodity_bot.py

          python -m py_compile soyuz_motors.py

          python -m py_compile soyuz_adapter.py

          python -m py_compile soyuz_shadow_integration.py


      # ==========================================================
      # TELEGRAM SECRETS CHECK
      # ==========================================================

      - name: Verify Telegram configuration

        run: |

          python - <<'PY'

          import os

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.getenv("TELEGRAM_CHAT_ID", "").strip()

          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN missing")

          if not chat:
              raise SystemExit("TELEGRAM_CHAT_ID missing")

          print("Telegram token: PRESENT")
          print("Telegram chat ID: PRESENT")

          PY


      # ==========================================================
      # RUN TELEGRAM LISTENER
      # ==========================================================

      - name: Run Telegram listener

        run: |

          python telegram_listener.py


      # ==========================================================
      # SAVE TELEGRAM OFFSET
      # ==========================================================

      - name: Persist Telegram listener state

        if: always()

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add telegram_listener_state.json 2>/dev/null || true

          if ! git diff --cached --quiet; then

            git commit -m "chore: persist Telegram listener offset"

            git push

          fi