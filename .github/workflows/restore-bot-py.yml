name: restore-bot-py

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.github_token || github.token}}

      - name: Restore bot.py from branch
        run: |
          git checkout feat/gagarin-telegram-menu -- telegram/bot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/bot.py
          git diff --cached --quiet && echo "No changes" || git commit -m "fix: restore telegram/bot.py from feat/gagarin-telegram-menu"
          git push
