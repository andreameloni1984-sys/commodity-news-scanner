name: restore-bot-py (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy direct-to-main mutation
        run: |
          echo "::error::DISABLED: legacy workflow can restore out-of-scope code or push directly to main. Use a reviewed pull request."
          exit 1
