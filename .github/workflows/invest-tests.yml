name: Invest regression tests
on:
  pull_request:
    paths: ['invest_scanner/**', 'tests/test_invest_scanner.py', '.github/workflows/invest*.yml', 'main.py', 'trump_tracker.py']
  push:
    branches: ['codex/invest-long-rebuild']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest -q tests/test_invest_scanner.py
