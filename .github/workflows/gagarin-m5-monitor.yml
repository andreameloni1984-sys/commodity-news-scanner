name: Gagarin Lightweight M5 Scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gagarin-light-m5-scan
  cancel-in-progress: true

jobs:
  scan:
    name: Inspect completed M5 candles (seven commodities; silver excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAPER_TRADING_ONLY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run lightweight M5 interception scan
        run: python gagarin_m5_monitor.py
