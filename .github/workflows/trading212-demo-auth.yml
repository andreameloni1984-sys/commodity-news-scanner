name: Trading 212 DEMO authenticated read-only smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      T212_KEY: ${{ secrets.TRADING212_DEMO_API_KEY }}
      T212_SECRET: ${{ secrets.TRADING212_DEMO_API_SECRET }}
    steps:
      - name: Verify DEMO authentication without exposing credentials or account data
        shell: bash
        run: |
          python - <<'PY'
          import base64, os, urllib.request, urllib.error, sys
          key = os.environ.get("T212_KEY", "")
          secret = os.environ.get("T212_SECRET", "")
          if not key or not secret:
              print("FAIL: Missing DEMO API key or secret")
              sys.exit(1)
          if key != key.strip() or secret != secret.strip():
              print("FAIL: DEMO credential contains leading/trailing whitespace; check GitHub Secret formatting. No values logged.")
              sys.exit(1)
          endpoint = "https://demo.trading212.com/api/v0/equity/account/summary"
          token = base64.b64encode((key + ":" + secret).encode()).decode()
          req = urllib.request.Request(endpoint, headers={"Authorization": "Basic " + token, "Accept": "application/json"}, method="GET")
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  status = response.status
                  import json
                  data = json.load(response)
                  if status != 200 or not isinstance(data, dict) or not isinstance(data.get("currency"), str):
                      print("FAIL: unexpected DEMO account response")
                      sys.exit(1)
                  print("PASS: Trading 212 DEMO authenticated account summary, valid currency field")
                  print("No account ID, balances, credentials or positions printed")
          except urllib.error.HTTPError as e:
              print("FAIL: DEMO authentication/account request HTTP status", e.code)
              if e.code == 401:
                  print("DIAGNOSIS: DEMO rejected credentials; verify key/secret pair, DEMO environment and API key permissions. No secret values logged.")
              sys.exit(1)
          except Exception as e:
              print("FAIL: DEMO request failed:", type(e).__name__)
              sys.exit(1)
          print("READ-ONLY: no POST, no order, no LIVE endpoint")
          PY
