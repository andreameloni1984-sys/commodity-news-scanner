name: gagarin Invest Research

on:
  workflow_dispatch:
    inputs:
      notify:
        description: "Invia candidati demo al Telegram configurato (richiede catalogo Invest)"
        type: boolean
        default: false
      environment:
        description: "Catalogo da leggere; nessun ordine viene inviato"
        type: choice
        options: [demo, live]
        default: demo
permissions:
  contents: read
concurrency:
  group: gagarin-invest-research
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      T212_API_KEY: ${{ secrets.T212_API_KEY }}
      T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
      T212_ENVIRONMENT: ${{ inputs.environment }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTIFY: ${{ inputs.notify }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Verify Invest selector
        run: python -m pytest -q tests/test_invest_scanner.py
      - uses: actions/cache/restore@v4
        if: inputs.notify
        with:
          path: .invest-state
          key: gagarin-invest-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gagarin-invest-${{ github.ref_name }}-
      - name: Validate notification configuration
        if: inputs.notify
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::TELEGRAM_BOT_TOKEN required"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::TELEGRAM_CHAT_ID required"; exit 1; }
          test -n "$T212_API_KEY" || { echo "::error::T212_API_KEY required for catalog verification"; exit 1; }
          test -n "$T212_API_SECRET" || { echo "::error::T212_API_SECRET required for catalog verification"; exit 1; }
      - name: Scan stocks (no orders)
        run: |
          if [ "$NOTIFY" = "true" ]; then
            python -m invest_scanner gagarin --notify
          else
            python -m invest_scanner gagarin
          fi
      - uses: actions/cache/save@v4
        if: always() && inputs.notify
        with:
          path: .invest-state
          key: gagarin-invest-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
