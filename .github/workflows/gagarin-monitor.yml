name: Gagarin Paper Monitor (GitHub Actions)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gagarin-paper-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Run Gagarin directly on GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ENABLED: "1"
      SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
      T212_API_KEY: ${{ secrets.T212_API_KEY }}
      T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
      PAPER_TRADING_ONLY: "1"
      # AGGRESSIVE forecast profile: wider candidate funnel; core safety gates stay on.
      MIN_ENTRY_PROBABILITY: "55"
      MIN_ENTRY_QUALITY: "45"
      MIN_ENTRY_CONFIDENCE: "50"
      MIN_ENTRY_RR: "2.5"
      MAX_ENTRY_STOP_ATR: "2.5"
      SL_STRUCTURE_BUFFER_ATR: "0.15"
      SL_MIN_ATR: "0.80"
      MONITOR_INTERVAL_MINUTES: "15"
      POLITICAL_IMPACT_ENABLED: "1"
      US_PRESIDENT_IMPACT_ENABLED: "1"
      ELECTION_IMPACT_ENABLED: "1"
      FUTURES_STRUCTURE_ENABLED: "1"
      WEATHER_ENABLED: "1"
      DISASTER_ENABLED: "1"
      CFTC_ENABLED: "1"
      EIA_ENABLED: "1"
      SOLE24_ENABLED: "1"
      GAGARIN_FOREX_ON_DEMAND: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Validate configuration
        run: |
          python --version
          test -n "$TWELVE_DATA_API_KEY" || { echo "::error::TWELVE_DATA_API_KEY secret missing"; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::TELEGRAM_BOT_TOKEN secret missing"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::TELEGRAM_CHAT_ID secret missing"; exit 1; }
          echo "PAPER_TRADING_ONLY=$PAPER_TRADING_ONLY"
          echo "AGGRESSIVE_THRESHOLDS=$MIN_ENTRY_PROBABILITY/$MIN_ENTRY_QUALITY/$MIN_ENTRY_CONFIDENCE RR=$MIN_ENTRY_RR"

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run Gagarin analysis, paper journal, feedback and Telegram alerts
        run: python main.py
