name: Gagarin Paper Monitor (GitHub Actions)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gagarin-feedback-state
  cancel-in-progress: false

jobs:
  monitor:
    name: Run Gagarin directly on GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ENABLED: "1"
      SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
      T212_API_KEY: ${{ secrets.T212_API_KEY }}
      T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
      PAPER_TRADING_ONLY: "1"
      # Soglie abbassate per test / più alert
      MIN_ENTRY_PROBABILITY: "40"
      MIN_ENTRY_QUALITY: "30"
      MIN_ENTRY_CONFIDENCE: "35"
      MIN_ENTRY_RR: "2.5"
      MAX_ENTRY_STOP_ATR: "2.5"
      SL_STRUCTURE_BUFFER_ATR: "0.15"
      SL_MIN_ATR: "0.80"
      MONITOR_INTERVAL_MINUTES: "15"
      POLITICAL_IMPACT_ENABLED: "1"
      US_PRESIDENT_IMPACT_ENABLED: "1"
      ELECTION_IMPACT_ENABLED: "1"
      FUTURES_STRUCTURE_ENABLED: "1"
      WEATHER_ENABLED: "1"
      DISASTER_ENABLED: "1"
      CFTC_ENABLED: "1"
      EIA_ENABLED: "1"
      SOLE24_ENABLED: "1"
      GAGARIN_FOREX_ON_DEMAND: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Validate configuration
        run: |
          python --version
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::TELEGRAM_BOT_TOKEN secret missing"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::TELEGRAM_CHAT_ID secret missing"; exit 1; }
          echo "PAPER_TRADING_ONLY=$PAPER_TRADING_ONLY"
          echo "THRESHOLDS=$MIN_ENTRY_PROBABILITY/$MIN_ENTRY_QUALITY/$MIN_ENTRY_CONFIDENCE RR=$MIN_ENTRY_RR"

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run Gagarin analysis, paper journal, feedback and Telegram alerts
        run: python main.py

      - name: Persist Gagarin paper journal and feedback across GitHub runners
        if: always()
        run: |
          files=()
          for file in gagarin_feedback.csv paper_trade_log.csv; do
            if [ -f "$file" ]; then
              files+=("$file")
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No local journal/feedback CSV produced; PostgreSQL may be active or this run recorded no entries."
            exit 0
          fi
          git config user.name "Gagarin Paper Bot"
          git config user.email "gagarin-paper-bot@users.noreply.github.com"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "Gagarin paper journal and feedback unchanged."
            exit 0
          fi
          git commit -m "chore: persist Gagarin paper journal and feedback"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
