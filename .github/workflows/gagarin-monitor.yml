name: Gagarin Paper Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake and run Gagarin
        run: |
          curl --fail --silent --show-error \
            --max-time 180 \
            -X POST \
            -H "User-Agent: Gagarin-GitHub-Monitor" \
            "https://gagarin-cloud.onrender.com/api/monitor"

          # Keep the free Telegram webhook service awake so its 60-second
          # public-news monitor continues running between Telegram updates.
          curl --fail --silent --show-error \
            --max-time 180 \
            -H "User-Agent: Gagarin-News-Monitor-Keepalive" \
            "https://soyuz-gagarin-telegram-v2.onrender.com/health"
