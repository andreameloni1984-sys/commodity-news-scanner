name: Commodities Bot v3.8 Event Driven

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: commodities-bot-v3-8
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Commodities Bot v3.8
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          PAPER_TRADING_ONLY: '1'
          DEMO_TRADING_ENABLED: '0'

          MONITOR_INTERVAL_MINUTES: '15'

          COMMUNICATION_MODE: 'MORNING_USA_EVENT'
          SILENT_INTERNAL_ANALYSIS: '0'
          EVENT_ALERTS_ENABLED: '1'
          MONITOR_SEND_FULL: '1'

          MORNING_REPORT_HOUR: '5'
          MORNING_REPORT_MINUTE: '30'

          USA_REPORT_HOUR: '14'
          USA_REPORT_MINUTE: '30'

          EOD_REPORT_HOUR: '21'

          MIN_ENTRY_PROBABILITY: '62'
          MIN_ENTRY_QUALITY: '55'
          MIN_ENTRY_CONFIDENCE: '60'
          MIN_ENTRY_RR: '2.0'

        run: python commodity_bot.py