name: Commodities Bot v4.6 Telegram Live Price On-Demand

on:
  workflow_dispatch:
    inputs:
      telegram_request:
        description: "Richiesta Telegram"
        required: true
        type: string
      telegram_chat_id:
        description: "Chat ID Telegram"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: commodities-bot-on-demand
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify Python syntax
        run: |
          python -m py_compile commodity_bot.py live_price_engine.py runner_live.py

      - name: Run Commodities Bot v4.6 Live Price On-Demand
        env:

          # =========================
          # API
          # =========================

          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

          # =========================
          # LIVE PRICE / BROKER DEMO
          # =========================

          LIVE_PRICE_ENABLED: "1"
          LIVE_PRICE_PRIMARY: "OANDA"
          LIVE_PRICE_REQUIRE_BID_ASK: "1"
          LIVE_PRICE_MAX_AGE_SECONDS: "30"

          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_BASE_URL: "https://api-fxpractice.oanda.com"

          OANDA_INSTRUMENT_MAP_JSON: ${{ secrets.OANDA_INSTRUMENT_MAP_JSON }}

          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          TRADING_ECONOMICS_CLIENT: ${{ secrets.TRADING_ECONOMICS_CLIENT }}

          # =========================
          # ON-DEMAND
          # =========================

          ON_DEMAND_ONLY: "1"
          ON_DEMAND_TELEGRAM_REQUEST: ${{ inputs.telegram_request }}
          ON_DEMAND_TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}

          # =========================
          # PAPER TRADING
          # =========================

          PAPER_TRADING_ONLY: "1"
          DEMO_TRADING_ENABLED: "0"

          # =========================
          # MONITOR
          # =========================

          MONITOR_INTERVAL_MINUTES: "15"
          MONITOR_TOP_N: "3"
          MONITOR_SEND_FULL: "0"

          COMMUNICATION_MODE: "ON_DEMAND"
          SILENT_INTERNAL_ANALYSIS: "1"
          EVENT_ALERTS_ENABLED: "0"

          # =========================
          # EXTERNAL INTELLIGENCE
          # =========================

          EXTERNAL_INTELLIGENCE_ENABLED: "1"
          EXTERNAL_INTELLIGENCE_SHADOW: "1"
          CFTC_ENABLED: "1"
          EIA_ENABLED: "1"

          EXTERNAL_INTELLIGENCE_TIMEOUT_SECONDS: "15"
          EXTERNAL_INTELLIGENCE_CACHE_HOURS: "12"
          EXTERNAL_INTELLIGENCE_CACHE_FILE: "commodities_external_intelligence_cache.json"

          # =========================
          # MARKET ENGINE
          # =========================

          DAILY_BIAS_ENABLED: "1"
          CANDLE_ENGINE_ENABLED: "1"
          PRICE_ACTION_ENABLED: "1"
          ADAPTIVE_RISK_ENABLED: "1"
          EXIT_ENGINE_ENABLED: "1"
          REGIME_ENABLED: "1"

          # =========================
          # EARLY OPPORTUNITY
          # =========================

          EARLY_OPPORTUNITY_ENABLED: "1"
          EARLY_TOP_N: "5"
          EARLY_REFRESH_MINUTES: "60"
          EARLY_HISTORY_MIN_MONTHS: "12"
          EARLY_HISTORY_YEARS_TARGET: "5"

          # =========================
          # TELEGRAM
          # =========================

          TELEGRAM_COMMANDS_ENABLED: "0"
          TELEGRAM_COMMAND_MAX_AGE_SECONDS: "900"

          # =========================
          # MARKET INTELLIGENCE
          # =========================

          MARKET_INTELLIGENCE_ENABLED: "1"
          MARKET_INTELLIGENCE_MODE: "PRICEPEDIA_STYLE"
          MARKET_INTELLIGENCE_OPTIONAL_SOURCES: "1"

          POLITICAL_IMPACT_ENABLED: "1"
          GEOPOLITICAL_IMPACT_ENABLED: "1"

          COMMODITY_FUNDAMENTALS_ENABLED: "1"
          MARKET_REGIME_ENABLED: "1"
          CROSS_COMMODITY_ANALYSIS_ENABLED: "1"
          FUTURES_STRUCTURE_ENABLED: "1"
          VOLATILITY_CONTEXT_ENABLED: "1"

          CME_REQUIRED: "0"

          # =========================
          # TWELVE DATA
          # =========================

          TWELVE_DATA_COMMODITIES_ENABLED: "1"
          TWELVE_DATA_DEBUG: "1"
          TWELVE_DATA_TIMEOUT_SECONDS: "20"

          # =========================
          # WEATHER / DISASTER
          # =========================

          WEATHER_ENABLED: "1"
          DISASTER_ENABLED: "1"

          WEATHER_CACHE_HOURS: "3"
          FUTURES_CACHE_HOURS: "3"

          FUTURES_SYMBOLS_JSON: "{}"

          TRADING_KNOWLEDGE_URLS: ""

          # =========================
          # SOLE 24 ORE
          # =========================

          SOLE24_ENABLED: "1"
          SOLE24_TIMEOUT: "12"
          SOLE24_CACHE_HOURS: "3"
          SOLE24_WEIGHT: "0.15"

          # =========================
          # ENTRY FILTERS
          # =========================

          MIN_ENTRY_PROBABILITY: "62"
          MIN_ENTRY_QUALITY: "55"
          MIN_ENTRY_CONFIDENCE: "60"

          MIN_ENTRY_RR: "2.5"

          MIN_ENTRY_RR_TP1: "1.5"
          MIN_ENTRY_RR_TP2: "2.0"
          MIN_ENTRY_RR_TP3: "2.5"

          MAX_ENTRY_STOP_ATR: "2.5"

          SL_STRUCTURE_BUFFER_ATR: "0.15"
          SL_MIN_ATR: "0.80"

          INTRADAY_ALERT_MIN_SCORE: "70"

          # =========================
          # STATISTICAL SL / TP
          # =========================

          STAT_SLTP_LOOKBACK: "1500"
          STAT_SLTP_FORWARD_BARS: "6"

          STAT_MAE_QUANTILE: "0.70"

          STAT_MFE_Q1: "0.55"
          STAT_MFE_Q2: "0.70"
          STAT_MFE_Q3: "0.82"

          # =========================
          # PREDICTION JOURNAL
          # =========================

          PREDICTION_HORIZON_HOURS: "6"
          PERFORMANCE_RETENTION_DAYS: "90"

          # =========================
          # INTELLIGENCE WEIGHTS
          # =========================

          INTELLIGENCE_WEIGHT: "0.20"
          POLITICAL_IMPACT_WEIGHT: "0.20"
          GEOPOLITICAL_IMPACT_WEIGHT: "0.20"
          FUNDAMENTALS_WEIGHT: "0.15"
          MARKET_REGIME_WEIGHT: "0.10"
          CROSS_COMMODITY_WEIGHT: "0.10"
          FUTURES_STRUCTURE_WEIGHT: "0.05"

        run: python runner_live.py

      - name: Persist bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            position.json \
            commodities_direction_state.json \
            commodities_prediction_log.json \
            commodities_daily_report_state.json \
            commodities_communication_state.json \
            commodities_monitor_state.json \
            commodities_futures_structure_cache.json \
            commodities_weather_cache.json \
            trading_knowledge_cache.json \
            validated_trading_rules.json \
            commodities_external_intelligence_cache.json \
            sole24_context_cache.json \
            commodities_demo_orders.json \
            2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "feat: add live price engine and demo-ready pricing"
            git push
          fi