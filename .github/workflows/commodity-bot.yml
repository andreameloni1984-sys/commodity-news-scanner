name: Commodities Bot v4.2 Signal Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commodities-bot-v4-2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify Python syntax
        run: |
          python -m py_compile commodity_bot.py

      - name: Run Commodities Bot v4.2
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # SICUREZZA - SOLO PAPER
          PAPER_TRADING_ONLY: '1'
          DEMO_TRADING_ENABLED: '0'

          # MONITORAGGIO
          MONITOR_INTERVAL_MINUTES: '15'
          MONITOR_TOP_N: '3'
          MONITOR_SEND_FULL: '0'
          COMMUNICATION_MODE: 'MORNING_USA_EVENT'
          SILENT_INTERNAL_ANALYSIS: '1'
          EVENT_ALERTS_ENABLED: '1'

          # LAYER TECNICI
          CANDLE_ENGINE_ENABLED: '1'
          PRICE_ACTION_ENABLED: '1'
          ADAPTIVE_RISK_ENABLED: '1'
          EXIT_ENGINE_ENABLED: '1'
          REGIME_ENABLED: '1'

          # EARLY OPPORTUNITY
          EARLY_OPPORTUNITY_ENABLED: '1'
          EARLY_TOP_N: '5'
          EARLY_REFRESH_MINUTES: '60'
          EARLY_HISTORY_MIN_MONTHS: '12'
          EARLY_HISTORY_YEARS_TARGET: '5'

          # TELEGRAM ON-DEMAND
          TELEGRAM_COMMANDS_ENABLED: '1'
          TELEGRAM_COMMAND_MAX_AGE_SECONDS: '900'

          # REPORT
          MORNING_REPORT_HOUR: '5'
          MORNING_REPORT_MINUTE: '30'
          USA_REPORT_HOUR: '14'
          USA_REPORT_MINUTE: '30'
          EOD_REPORT_HOUR: '21'

          # MARKET INTELLIGENCE
          MARKET_INTELLIGENCE_ENABLED: '1'
          MARKET_INTELLIGENCE_MODE: 'PRICEPEDIA_STYLE'
          MARKET_INTELLIGENCE_OPTIONAL_SOURCES: '1'
          POLITICAL_IMPACT_ENABLED: '1'
          GEOPOLITICAL_IMPACT_ENABLED: '1'
          COMMODITY_FUNDAMENTALS_ENABLED: '1'
          MARKET_REGIME_ENABLED: '1'
          CROSS_COMMODITY_ANALYSIS_ENABLED: '1'
          FUTURES_STRUCTURE_ENABLED: '1'
          VOLATILITY_CONTEXT_ENABLED: '1'

          # DATI E FONTI
          WEATHER_ENABLED: '1'
          DISASTER_ENABLED: '1'
          WEATHER_CACHE_HOURS: '3'
          FUTURES_CACHE_HOURS: '3'
          FUTURES_SYMBOLS_JSON: '{}'
          TRADING_KNOWLEDGE_URLS: ''

          # ENTRY / RISCHIO
          MIN_ENTRY_PROBABILITY: '62'
          MIN_ENTRY_QUALITY: '55'
          MIN_ENTRY_CONFIDENCE: '60'
          MIN_ENTRY_RR: '2.5'
          MIN_ENTRY_RR_TP1: '1.5'
          MIN_ENTRY_RR_TP2: '2.0'
          MAX_ENTRY_STOP_ATR: '2.5'
          INTRADAY_ALERT_MIN_SCORE: '70'

          # STATISTICA SL / TP
          PREDICTION_HORIZON_HOURS: '6'
          PERFORMANCE_RETENTION_DAYS: '90'

          # PESI MARKET INTELLIGENCE
          INTELLIGENCE_WEIGHT: '0.20'
          POLITICAL_IMPACT_WEIGHT: '0.20'
          GEOPOLITICAL_IMPACT_WEIGHT: '0.20'
          FUNDAMENTALS_WEIGHT: '0.15'
          MARKET_REGIME_WEIGHT: '0.10'
          CROSS_COMMODITY_WEIGHT: '0.10'
          FUTURES_STRUCTURE_WEIGHT: '0.05'

      - name: Persist bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            position.json \
            commodities_direction_state.json \
            commodities_prediction_log.json \
            commodities_daily_report_state.json \
            commodities_communication_state.json \
            commodities_monitor_state.json \
            telegram_update_offset.json \
            commodities_futures_structure_cache.json \
            commodities_weather_cache.json \
            trading_knowledge_cache.json \
            validated_trading_rules.json \
            2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: persist commodities bot v4.2 state"
            git push
          fi 