name: Commodities Bot v4.1 Market Intelligence + Daily Bias + Telegram

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commodities-bot-v4-1
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Commodities Bot v4.1
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          PAPER_TRADING_ONLY: '1'
          DEMO_TRADING_ENABLED: '0'

          MONITOR_INTERVAL_MINUTES: '15'
          COMMUNICATION_MODE: 'MORNING_USA_EVENT'
          SILENT_INTERNAL_ANALYSIS: '1'
          EVENT_ALERTS_ENABLED: '1'
          MONITOR_SEND_FULL: '0'

          DAILY_BIAS_ENABLED: '1'
          TELEGRAM_COMMANDS_ENABLED: '1'
          TELEGRAM_COMMAND_MAX_AGE_SECONDS: '900'

          MORNING_REPORT_HOUR: '5'
          MORNING_REPORT_MINUTE: '30'

          USA_REPORT_HOUR: '14'
          USA_REPORT_MINUTE: '30'

          EOD_REPORT_HOUR: '21'

          # MARKET INTELLIGENCE ENGINE
          MARKET_INTELLIGENCE_ENABLED: '1'
          MARKET_INTELLIGENCE_MODE: 'PRICEPEDIA_STYLE'
          MARKET_INTELLIGENCE_OPTIONAL_SOURCES: '1'

          POLITICAL_IMPACT_ENABLED: '1'
          GEOPOLITICAL_IMPACT_ENABLED: '1'
          COMMODITY_FUNDAMENTALS_ENABLED: '1'
          MARKET_REGIME_ENABLED: '1'
          CROSS_COMMODITY_ANALYSIS_ENABLED: '1'
          FUTURES_STRUCTURE_ENABLED: '1'
          VOLATILITY_CONTEXT_ENABLED: '1'

          # CME NON È OBBLIGATORIO
          CME_REQUIRED: '0'

          # DATA ENGINE
          TWELVE_DATA_COMMODITIES_ENABLED: '1'
          TWELVE_DATA_DEBUG: '1'
          TWELVE_DATA_TIMEOUT_SECONDS: '20'

          MIN_ENTRY_PROBABILITY: '62'
          MIN_ENTRY_QUALITY: '55'
          MIN_ENTRY_CONFIDENCE: '60'

          MIN_ENTRY_RR: '2.5'
          MIN_ENTRY_RR_TP1: '1.5'
          MIN_ENTRY_RR_TP2: '2.0'
          MIN_ENTRY_RR_TP3: '2.5'

          MAX_ENTRY_STOP_ATR: '2.5'
          SL_STRUCTURE_BUFFER_ATR: '0.15'
          SL_MIN_ATR: '0.80'

          STAT_SLTP_LOOKBACK: '1500'
          STAT_SLTP_FORWARD_BARS: '6'
          STAT_MAE_QUANTILE: '0.70'
          STAT_MFE_Q1: '0.55'
          STAT_MFE_Q2: '0.70'
          STAT_MFE_Q3: '0.82'

          # INTELLIGENCE WEIGHTS
          INTELLIGENCE_WEIGHT: '0.20'
          POLITICAL_IMPACT_WEIGHT: '0.20'
          GEOPOLITICAL_IMPACT_WEIGHT: '0.20'
          FUNDAMENTALS_WEIGHT: '0.15'
          MARKET_REGIME_WEIGHT: '0.10'
          CROSS_COMMODITY_WEIGHT: '0.10'
          FUTURES_STRUCTURE_WEIGHT: '0.05'

        run: python commodity_bot.py

      - name: Persist bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            commodities_communication_state.json \
            telegram_update_offset.json \
            commodities_daily_bias.json \
            commodities_latest_snapshot.json \
            2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: persist commodities bot v4.1 state"
            git push
          fi