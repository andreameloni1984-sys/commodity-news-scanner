name: Commodities Bot v6.1.9 - SOYUZ GAGARIN

on:
  workflow_dispatch:
    inputs:
      telegram_request:
        description: "Richiesta Telegram (es. CLASSIFICA, ORO, SCALPING ORO)"
        required: false
        default: ""
        type: string
      telegram_chat_id:
        description: "Chat ID Telegram"
        required: false
        default: ""
        type: string
      request_type:
        description: "CLASSIFICA / SETUP / SEGNALI / COMMODITY / PREZZO / SCALPING"
        required: false
        default: ""
        type: string
      request_commodity:
        description: "Commodity richiesta"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "0 3 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "0 19 * * 1-5"
    - cron: "0 20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: commodities-bot-v6-1-9
  cancel-in-progress: false

jobs:
  commodities:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      REPORT_TYPE: ${{ github.event.schedule == '0 3 * * 1-5' && 'ASIA' || github.event.schedule == '0 4 * * 1-5' && 'ASIA' || github.event.schedule == '0 6 * * 1-5' && 'EUROPE' || github.event.schedule == '0 7 * * 1-5' && 'EUROPE' || github.event.schedule == '30 12 * * 1-5' && 'USA' || github.event.schedule == '30 13 * * 1-5' && 'USA' || github.event.schedule == '0 19 * * 1-5' && 'EOD' || github.event.schedule == '0 20 * * 1-5' && 'EOD' || 'NONE' }}

      RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.telegram_request != '' || github.event.inputs.request_type != '') && 'ON_DEMAND' || github.event_name == 'workflow_dispatch' && 'MANUAL_TEST' || 'SCHEDULED' }}

      ON_DEMAND_TELEGRAM_REQUEST: ${{ github.event.inputs.telegram_request || '' }}
      ON_DEMAND_TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id || '' }}

      REQUEST_TYPE: ${{ github.event.inputs.request_type || '' }}
      REQUEST_COMMODITY: ${{ github.event.inputs.request_commodity || '' }}

      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
      SIFTING_BASE_URL: https://api.sifting.io

      SIFTING_LIVE_ENABLED: "1"
      SIFTING_LIVE_REQUIRED: "0"
      SIFTING_LIVE_MAX_AGE_SECONDS: "30"
      SIFTING_TIMEOUT_SECONDS: "8"
      SIFTING_MAX_LIVE_QUOTES_PER_RUN: "6"

      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      COMMUNICATION_MODE: HYBRID

      PAPER_TRADING_ONLY: "1"
      DEMO_TRADING_ENABLED: "0"

      MONITOR_INTERVAL_MINUTES: "15"
      MONITOR_SEND_FULL: "0"
      SILENT_INTERNAL_ANALYSIS: "1"
      EVENT_ALERTS_ENABLED: "0"

      MIN_ENTRY_PROBABILITY: "62"
      MIN_ENTRY_QUALITY: "55"
      MIN_ENTRY_CONFIDENCE: "60"

      MIN_ENTRY_RR: "2.5"
      MIN_ENTRY_RR_TP1: "1.5"
      MIN_ENTRY_RR_TP2: "2.0"
      MIN_ENTRY_RR_TP3: "2.5"

      MAX_ENTRY_STOP_ATR: "2.5"
      SL_STRUCTURE_BUFFER_ATR: "0.15"
      SL_MIN_ATR: "0.80"

      GAGARIN_FINAL_AUTHORITY: "1"
      GAGARIN_REQUIRE_LIVE_FOR_ENTRY: "1"

      KNOWLEDGE_ENGINE_V5_ENABLED: "1"
      PRE_USA_ENGINE_ENABLED: "1"
      LONG_TERM_ENABLED: "1"
      INTRADAY_JOURNAL_ALL: "1"

      MARKET_INTELLIGENCE_ENABLED: "1"
      EXTERNAL_INTELLIGENCE_ENABLED: "1"
      POLITICAL_IMPACT_ENABLED: "1"
      GEOPOLITICAL_IMPACT_ENABLED: "1"

      COMMODITY_FUNDAMENTALS_ENABLED: "1"
      MARKET_REGIME_ENABLED: "1"
      CROSS_COMMODITY_ANALYSIS_ENABLED: "1"
      VOLATILITY_CONTEXT_ENABLED: "1"
      FUTURES_STRUCTURE_ENABLED: "1"

      CFTC_ENABLED: "1"
      EIA_ENABLED: "1"
      WEATHER_ENABLED: "1"
      DISASTER_ENABLED: "1"
      SOLE24_ENABLED: "1"

      EARLY_OPPORTUNITY_ENABLED: "1"
      SCALPING_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy feedparser

      - name: Verify bot
        run: |
          test -f commodity_bot.py
          python -m py_compile commodity_bot.py

      - name: Run Commodities Bot
        run: python commodity_bot.py

      - name: Persist bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            position.json \
            commodities_direction_state.json \
            commodities_prediction_log.json \
            commodities_daily_report_state.json \
            commodities_communication_state.json \
            commodities_monitor_state.json \
            commodities_futures_structure_cache.json \
            commodities_weather_cache.json \
            trading_knowledge_cache.json \
            validated_trading_rules.json \
            commodities_external_intelligence_cache.json \
            2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: persist commodities bot state"
            git push
          fi