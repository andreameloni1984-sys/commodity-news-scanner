name: Commodities Bot v5.4 - Asia 06:00

on:
  schedule:
    # GitHub Actions usa UTC.
    # Il codice Python controlla l'ora Europe/Rome,
    # quindi il report viene inviato alle 06:00 italiane.
    - cron: '0 4 * * 1-5'
    - cron: '0 5 * * 1-5'

    # USA
    - cron: '30 12 * * 1-5'

    # Report serale
    - cron: '0 19 * * 1-5'

  workflow_dispatch:

concurrency:
  group: commodities-bot-v5-4
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Commodities Bot v5.4
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

          SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
          SIFTING_BASE_URL: https://api.sifting.io
          SIFTING_LIVE_ENABLED: '1'
          SIFTING_LIVE_REQUIRED: '0'
          SIFTING_LIVE_MAX_AGE_SECONDS: '30'
          SIFTING_TIMEOUT_SECONDS: '8'

          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          PAPER_TRADING_ONLY: '1'
          DEMO_TRADING_ENABLED: '0'

          # Automatic reports + Telegram commands
          ON_DEMAND_ONLY: '0'
          COMMUNICATION_MODE: 'MORNING_USA_EVENT'

          # 🌏 Asia & Oceania — 06:00 Italia
          ASIA_REPORT_HOUR: '6'
          ASIA_REPORT_MINUTE: '0'

          # 🇪🇺 Europa
          MORNING_REPORT_HOUR: '8'
          MORNING_REPORT_MINUTE: '0'

          # 🇺🇸 USA
          USA_REPORT_HOUR: '14'
          USA_REPORT_MINUTE: '30'

          # 🌙 Sera
          EOD_REPORT_HOUR: '21'

          MONITOR_INTERVAL_MINUTES: '15'
          MONITOR_SEND_FULL: '0'
          SILENT_INTERNAL_ANALYSIS: '1'
          EVENT_ALERTS_ENABLED: '0'

          # Entry policy
          MIN_ENTRY_PROBABILITY: '62'
          MIN_ENTRY_QUALITY: '55'
          MIN_ENTRY_CONFIDENCE: '60'

          MIN_ENTRY_RR: '2.5'
          MIN_ENTRY_RR_TP1: '1.5'
          MIN_ENTRY_RR_TP2: '2.0'
          MIN_ENTRY_RR_TP3: '2.5'

          MAX_ENTRY_STOP_ATR: '2.5'
          SL_STRUCTURE_BUFFER_ATR: '0.15'
          SL_MIN_ATR: '0.80'

        run: python commodity_bot.py