name: Commodities Bot v4.6 Telegram Live Price On-Demand

on:
  workflow_dispatch:
    inputs:
      telegram_request:
        description: "Richiesta Telegram"
        required: true
        type: string

      telegram_chat_id:
        description: "Chat ID Telegram"
        required: true
        type: string

      on_demand_scope:
        description: "Scope analisi: auto, all oppure nome commodity"
        required: false
        default: "auto"
        type: string

permissions:
  contents: write

concurrency:
  group: commodities-bot-on-demand
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify Python syntax
        run: |
          python -m py_compile commodity_bot.py live_price_engine.py runner_live.py

      - name: LIVE PRICE PREFLIGHT
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_BASE_URL: "https://api-fxpractice.oanda.com"
          LIVE_PRICE_ENABLED: "1"
          LIVE_PRICE_PRIMARY: "OANDA"
          LIVE_PRICE_REQUIRE_BID_ASK: "1"
          LIVE_PRICE_MAX_AGE_SECONDS: "30"
        run: |
          python - <<'PY'
          import os
          import sys

          try:
              from live_price_engine import get_live_quote

              token = os.getenv("OANDA_API_TOKEN", "").strip()
              account = os.getenv("OANDA_ACCOUNT_ID", "").strip()

              if not token:
                  print("❌ LIVE PRICE BLOCCATO: OANDA_API_TOKEN mancante")
                  sys.exit(1)

              if not account:
                  print("❌ LIVE PRICE BLOCCATO: OANDA_ACCOUNT_ID mancante")
                  sys.exit(1)

              tests = {
                  "Oro": "GC=F",
              }

              for name, symbol in tests.items():
                  quote = get_live_quote(name, symbol)

                  if not quote:
                      print(f"❌ LIVE PRICE BLOCCATO: nessuna quotazione live per {name}")
                      sys.exit(1)

                  bid = quote.get("bid")
                  ask = quote.get("ask")

                  if bid is None or ask is None:
                      print(f"❌ LIVE PRICE BLOCCATO: BID/ASK mancanti per {name}")
                      sys.exit(1)

                  print(
                      f"✅ OK LIVE {name} | "
                      f"BID={bid} | ASK={ask} | "
                      f"provider={quote.get('provider')} | "
                      f"timestamp={quote.get('timestamp')}"
                  )

          except Exception as exc:
              print(f"❌ LIVE PRICE BLOCCATO: {exc}")
              sys.exit(1)
          PY

      - name: Run Commodities Bot v4.6 Live Price On-Demand
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

          LIVE_PRICE_ENABLED: "1"
          LIVE_PRICE_PRIMARY: "OANDA"
          LIVE_PRICE_REQUIRE_BID_ASK: "1"
          LIVE_PRICE_MAX_AGE_SECONDS: "30"

          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_BASE_URL: "https://api-fxpractice.oanda.com"
          OANDA_INSTRUMENT_MAP_JSON: ${{ secrets.OANDA_INSTRUMENT_MAP_JSON }}

          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          TRADING_ECONOMICS_CLIENT: ${{ secrets.TRADING_ECONOMICS_CLIENT }}

          ON_DEMAND_ONLY: "1"
          ON_DEMAND_TELEGRAM_REQUEST: ${{ inputs.telegram_request }}
          ON_DEMAND_TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          ON_DEMAND_SCOPE: ${{ inputs.on_demand_scope }}

          PAPER_TRADING_ONLY: "1"
          DEMO_TRADING_ENABLED: "0"

          MONITOR_INTERVAL_MINUTES: "15"
          MONITOR_TOP_N: "3"
          MONITOR_SEND_FULL: "0"

          COMMUNICATION_MODE: "ON_DEMAND"
          SILENT_INTERNAL_ANALYSIS: "1"
          EVENT_ALERTS_ENABLED: "0"

          EXTERNAL_INTELLIGENCE_ENABLED: "1"
          EXTERNAL_INTELLIGENCE_SHADOW: "1"
          EXTERNAL_INTELLIGENCE_TIMEOUT_SECONDS: "15"
          EXTERNAL_INTELLIGENCE_CACHE_HOURS: "12"
          EXTERNAL_INTELLIGENCE_CACHE_FILE: "commodities_external_intelligence_cache.json"

          CFTC_ENABLED: "1"
          EIA_ENABLED: "1"

          DAILY_BIAS_ENABLED: "1"
          CANDLE_ENGINE_ENABLED: "1"
          PRICE_ACTION_ENABLED: "1"
          ADAPTIVE_RISK_ENABLED: "1"
          EXIT_ENGINE_ENABLED: "1"
          REGIME_ENABLED: "1"

          EARLY_OPPORTUNITY_ENABLED: "1"
          EARLY_TOP_N: "5"
          EARLY_REFRESH_MINUTES: "60"
          EARLY_HISTORY_MIN_MONTHS: "12"
          EARLY_HISTORY_YEARS_TARGET: "5"

          TELEGRAM_COMMANDS_ENABLED: "0"
          TELEGRAM_COMMAND_MAX_AGE_SECONDS: "900"

          MARKET_INTELLIGENCE_ENABLED: "1"
          MARKET_INTELLIGENCE_MODE: "PRICEPEDIA_STYLE"
          MARKET_INTELLIGENCE_OPTIONAL_SOURCES: "1"

          POLITICAL_IMPACT_ENABLED: "1"
          GEOPOLITICAL_IMPACT_ENABLED: "1"

          COMMODITY_FUNDAMENTALS_ENABLED: "1"
          MARKET_REGIME_ENABLED: "1"
          CROSS_COMMODITY_ANALYSIS_ENABLED: "1"
          FUTURES_STRUCTURE_ENABLED: "1"
          VOLATILITY_CONTEXT_ENABLED: "1"

          CME_REQUIRED: "0"

          TWELVE_DATA_COMMODITIES_ENABLED: "1"
          TWELVE_DATA_DEBUG: "1"
          TWELVE_DATA_TIMEOUT_SECONDS: "20"

          WEATHER_ENABLED: "1"
          DISASTER_ENABLED: "1"

          WEATHER_CACHE_HOURS: "3"
          FUTURES_CACHE_HOURS: "3"

          FUTURES_SYMBOLS_JSON: