name: Commodities Bot v4.0

on:
  schedule:
    # Analisi ogni 5 minuti
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commodities-bot-v4
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Commodities Bot v4.0
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # =========================
          # TRADING MODE
          # =========================
          PAPER_TRADING_ONLY: "1"
          DEMO_TRADING_ENABLED: "0"

          # =========================
          # ANALYSIS
          # =========================
          MONITOR_INTERVAL_MINUTES: "5"
          SILENT_INTERNAL_ANALYSIS: "1"

          # =========================
          # TELEGRAM
          # =========================
          COMMUNICATION_MODE: "MORNING_USA_EVENT"
          EVENT_ALERTS_ENABLED: "1"
          MONITOR_SEND_FULL: "0"

          # =========================
          # REPORT ORARI
          # =========================
          MORNING_REPORT_HOUR: "5"
          MORNING_REPORT_MINUTE: "30"

          USA_REPORT_HOUR: "14"
          USA_REPORT_MINUTE: "30"

          EOD_REPORT_HOUR: "21"

          # =========================
          # ENTRY FILTER
          # =========================
          MIN_ENTRY_PROBABILITY: "62"
          MIN_ENTRY_QUALITY: "55"
          MIN_ENTRY_CONFIDENCE: "60"

          # =========================
          # RISK / REWARD
          # =========================
          MIN_ENTRY_RR: "2.5"
          MIN_ENTRY_RR_TP1: "1.5"
          MIN_ENTRY_RR_TP2: "2.0"
          MIN_ENTRY_RR_TP3: "2.5"

          MAX_ENTRY_STOP_ATR: "2.5"

          # =========================
          # SL STRUCTURE
          # =========================
          SL_STRUCTURE_BUFFER_ATR: "0.15"
          SL_MIN_ATR: "0.80"

          # =========================
          # STATISTICAL SL/TP
          # =========================
          STAT_SLTP_LOOKBACK: "1500"
          STAT_FORWARD_BARS: "6"

          STAT_MAE_QUANTILE: "0.70"
          STAT_MFE_Q1: "0.55"
          STAT_MFE_Q2: "0.70"
          STAT_MFE_Q3: "0.82"

      - name: Run bot
        run: |
          python commodity_bot.py

      # =========================
      # PERSIST COMMUNICATION STATE
      # =========================
      - name: Persist communication state
        if: always()
        run: |
          if [ -f commodities_communication_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add commodities_communication_state.json

            if ! git diff --cached --quiet; then
              git commit -m "chore: persist commodities communication state"
              git push
            fi
          fi