name: Commodities Bot v4.6 Telegram Live Price On-Demand

on:
  workflow_dispatch:
    inputs:
      telegram_request:
        description: "Richiesta Telegram"
        required: true
        type: string

      telegram_chat_id:
        description: "Chat ID Telegram"
        required: true
        type: string

      on_demand_scope:
        description: "Scope analisi: auto, all oppure nome commodity"
        required: false
        default: "auto"
        type: string

permissions:
  contents: write

concurrency:
  group: commodities-bot-on-demand
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify Python syntax
        run: |
          python -m py_compile commodity_bot.py
          python -m py_compile live_price_engine.py
          python -m py_compile runner_live.py

      - name: LIVE PRICE PREFLIGHT
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_BASE_URL: "https://api-fxpractice.oanda.com"
          LIVE_PRICE_ENABLED: "1"
          LIVE_PRICE_PRIMARY: "OANDA"
          LIVE_PRICE_REQUIRE_BID_ASK: "1"
          LIVE_PRICE_MAX_AGE_SECONDS: "30"

        run: |
          python - <<'PY'
          import os
          import sys

          from live_price_engine import get_live_quote

          token = os.getenv("OANDA_API_TOKEN", "").strip()
          account = os.getenv("OANDA_ACCOUNT_ID", "").strip()

          if not token:
              print("❌ OANDA_API_TOKEN mancante")
              print("Aggiungere il Repository Secret: OANDA_API_TOKEN")
              sys.exit(1)

          if not account:
              print("❌ OANDA_ACCOUNT_ID mancante")
              print("Aggiungere il Repository Secret: OANDA_ACCOUNT_ID")
              sys.exit(1)

          try:
              quote = get_live_quote("Oro", "GC=F")
          except Exception as exc:
              print(f"❌ Errore richiesta LIVE PRICE: {exc}")
              sys.exit(1)

          if not quote:
              print("❌ LIVE PRICE BLOCCATO")
              print("Nessuna quotazione OANDA disponibile.")
              sys.exit(1)

          bid = quote.get("bid")
          ask = quote.get("ask")

          if bid is None or ask is None:
              print("❌ LIVE PRICE BLOCCATO")
              print("BID/ASK mancanti.")
              sys.exit(1)

          print(
              f"✅ LIVE PRICE OK | "
              f"BID={bid} | "
              f"ASK={ask} | "
              f"provider={quote.get('provider')} | "
              f"timestamp={quote.get('timestamp')}"
          )
          PY

      - name: Run Commodities Bot v4.6
        env:

          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_BASE_URL: "https://api-fxpractice.oanda.com"
          OANDA_INSTRUMENT_MAP_JSON: ${{ secrets.OANDA_INSTRUMENT_MAP_JSON }}

          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          TRADING_ECONOMICS_CLIENT: ${{ secrets.TRADING_ECONOMICS_CLIENT }}

          LIVE_PRICE_ENABLED: "1"
          LIVE_PRICE_PRIMARY: "OANDA"
          LIVE_PRICE_REQUIRE_BID_ASK: "1"
          LIVE_PRICE_MAX_AGE_SECONDS: "30"

          ON_DEMAND_ONLY: "1"
          ON_DEMAND_TELEGRAM_REQUEST: ${{ inputs.telegram_request }}
          ON_DEMAND_TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          ON_DEMAND_SCOPE: ${{ inputs.on_demand_scope }}

          PAPER_TRADING_ONLY: "1"
          DEMO_TRADING_ENABLED: "0"

          MONITOR_INTERVAL_MINUTES: "15"
          MONITOR_SEND_FULL: "0"

          COMMUNICATION_MODE: "ON_DEMAND"
          SILENT_INTERNAL_ANALYSIS: "1"
          EVENT_ALERTS_ENABLED: "0"

          DAILY_BIAS_ENABLED: "1"
          CANDLE_ENGINE_ENABLED: "1"
          PRICE_ACTION_ENABLED: "1"
          ADAPTIVE_RISK_ENABLED: "1"
          EXIT_ENGINE_ENABLED: "1"
          REGIME_ENABLED: "1"

          EARLY_OPPORTUNITY_ENABLED: "1"

          MARKET_INTELLIGENCE_ENABLED: "1"
          MARKET_INTELLIGENCE_MODE: "PRICEPEDIA_STYLE"

          EXTERNAL_INTELLIGENCE_ENABLED: "1"
          EXTERNAL_INTELLIGENCE_SHADOW: "1"

          POLITICAL_IMPACT_ENABLED: "1"
          GEOPOLITICAL_IMPACT_ENABLED: "1"

          FUTURES_STRUCTURE_ENABLED: "1"

          CFTC_ENABLED: "1"
          EIA_ENABLED: "1"

          WEATHER_ENABLED: "1"
          DISASTER_ENABLED: "1"

          SOLE24_ENABLED: "1"
          SOLE24_TIMEOUT: "12"
          SOLE24_CACHE_HOURS: "3"
          SOLE24_WEIGHT: "0.15"

          MIN_ENTRY_PROBABILITY: "62"
          MIN_ENTRY_QUALITY: "55"
          MIN_ENTRY_CONFIDENCE: "60"

          MIN_ENTRY_RR: "2.5"
          MIN_ENTRY_RR_TP1: "1.5"
          MIN_ENTRY_RR_TP2: "2.0"
          MIN_ENTRY_RR_TP3: "2.5"

          MAX_ENTRY_STOP_ATR: "2.5"
          SL_STRUCTURE_BUFFER_ATR: "0.15"
          SL_MIN_ATR: "0.80"

        run: |
          python commodity_bot.py

      - name: Persist bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "feat: commodities bot v4.6 live price"
            git push
          fi