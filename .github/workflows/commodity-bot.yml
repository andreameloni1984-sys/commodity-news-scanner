name: Commodities Bot v4.3

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Commodities Bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          PAPER_TRADING_ONLY: '1'
          DEMO_TRADING_ENABLED: '0'

          COMMUNICATION_MODE: MORNING_USA_EVENT
          SILENT_INTERNAL_ANALYSIS: '1'
          EVENT_ALERTS_ENABLED: '0'
          MONITOR_SEND_FULL: '0'
          MONITOR_INTERVAL_MINUTES: '15'

          MORNING_REPORT_HOUR: '8'
          MORNING_REPORT_MINUTE: '0'

          USA_REPORT_HOUR: '14'
          USA_REPORT_MINUTE: '30'

          EOD_REPORT_HOUR: '21'
          EOD_REPORT_MINUTE: '0'

          POLITICAL_IMPACT_ENABLED: '1'
          US_PRESIDENT_IMPACT_ENABLED: '1'

          ELECTION_IMPACT_ENABLED: '1'
          ELECTION_LOOKBACK_DAYS: '21'
          ELECTION_CACHE_HOURS: '3'

          LONG_TERM_ENABLED: '1'
          LONG_TERM_RETENTION_DAYS: '450'
          LONG_TERM_HORIZONS_DAYS: '30,90,180,365'

          INTRADAY_JOURNAL_ALL: '1'
          INTRADAY_JOURNAL_RETENTION_DAYS: '120'
          INTRADAY_EVAL_HOURS: '6'

          FUTURES_STRUCTURE_ENABLED: '1'

          WEATHER_ENABLED: '1'
          DISASTER_ENABLED: '1'

          EARLY_OPPORTUNITY_ENABLED: '1'

          MIN_ENTRY_PROBABILITY: '62'
          MIN_ENTRY_QUALITY: '55'
          MIN_ENTRY_CONFIDENCE: '60'
          MIN_ENTRY_RR: '2.5'
          MIN_ENTRY_RR_TP1: '1.5'
          MIN_ENTRY_RR_TP2: '2.0'
          MAX_ENTRY_STOP_ATR: '2.5'

        run: |
          python commodity_bot.py

      - name: Persist bot journals and state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            commodities_prediction_log.json \
            commodities_long_term_forecasts.json \
            commodities_daily_report_state.json \
            commodities_communication_state.json \
            commodities_daily_selection.json \
            commodities_direction_state.json \
            commodities_monitor_state.json \
            commodities_weather_cache.json \
            commodities_election_cache.json \
            2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m 'chore: update commodities bot journals and state'
            git push
          else
            echo 'No state changes to commit.'
          fi