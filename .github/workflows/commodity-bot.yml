name: Commodities Bot v6.1.6 - SOYUZ GAGARIN

on:
  workflow_dispatch:
    inputs:
      request_type:
        description: "CLASSIFICA / SETUP / SEGNALI / COMMODITY / ANALISI / PREZZO / SCALPING"
        required: false
        default: ""

      request_commodity:
        description: "Commodity richiesta"
        required: false
        default: ""

  schedule:
    # ASIA — 05:00 Europe/Rome
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"

    # EUROPE — 08:00 Europe/Rome
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

    # USA — 14:30 Europe/Rome
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"

    # EOD — 21:00 Europe/Rome
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"

jobs:
  commodities:
    runs-on: ubuntu-latest

    env:
      # --------------------------------------------------
      # REPORT / REQUEST
      # --------------------------------------------------
      REPORT_TYPE: ${{ github.event.schedule == '0 3 * * *' && 'ASIA' || github.event.schedule == '0 4 * * *' && 'ASIA' || github.event.schedule == '0 6 * * *' && 'EUROPE' || github.event.schedule == '0 7 * * *' && 'EUROPE' || github.event.schedule == '30 12 * * *' && 'USA' || github.event.schedule == '30 13 * * *' && 'USA' || github.event.schedule == '0 19 * * *' && 'EOD' || github.event.schedule == '0 20 * * *' && 'EOD' || 'NONE' }}

      REQUEST_TYPE: ${{ github.event.inputs.request_type || '' }}
      REQUEST_COMMODITY: ${{ github.event.inputs.request_commodity || '' }}

      RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.request_type != '' && 'ON_DEMAND' || 'MANUAL_TEST') || 'SCHEDULED' }}

      # --------------------------------------------------
      # DATA
      # --------------------------------------------------
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

      SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
      SIFTING_BASE_URL: https://api.sifting.io
      SIFTING_LIVE_ENABLED: 1
      SIFTING_LIVE_REQUIRED: 0
      SIFTING_LIVE_MAX_AGE_SECONDS: 30
      SIFTING_TIMEOUT_SECONDS: 8
      SIFTING_MAX_LIVE_QUOTES_PER_RUN: 6

      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      # --------------------------------------------------
      # TELEGRAM
      # --------------------------------------------------
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      COMMUNICATION_MODE: HYBRID

      # --------------------------------------------------
      # TRADING SAFETY
      # --------------------------------------------------
      PAPER_TRADING_ONLY: 1
      DEMO_TRADING_ENABLED: 0

      MONITOR_INTERVAL_MINUTES: 15
      MONITOR_SEND_FULL: 0
      SILENT_INTERNAL_ANALYSIS: 1
      EVENT_ALERTS_ENABLED: 0

      # --------------------------------------------------
      # ENTRY POLICY
      # --------------------------------------------------
      MIN_ENTRY_PROBABILITY: 62
      MIN_ENTRY_QUALITY: 55
      MIN_ENTRY_CONFIDENCE: 60

      MIN_ENTRY_RR: 2.5
      MIN_ENTRY_RR_TP1: 1.5
      MIN_ENTRY_RR_TP2: 2.0
      MIN_ENTRY_RR_TP3: 2.5

      MAX_ENTRY_STOP_ATR: 2.5
      SL_STRUCTURE_BUFFER_ATR: 0.15
      SL_MIN_ATR: 0.80

      # --------------------------------------------------
      # KNOWLEDGE / HISTORY
      # --------------------------------------------------
      KNOWLEDGE_ENGINE_V5_ENABLED: 1
      PRE_USA_ENGINE_ENABLED: 1
      LONG_TERM_ENABLED: 1
      INTRADAY_JOURNAL_ALL: 1

      # --------------------------------------------------
      # MARKET INTELLIGENCE
      # --------------------------------------------------
      MARKET_INTELLIGENCE_ENABLED: 1
      EXTERNAL_INTELLIGENCE_ENABLED: 1

      POLITICAL_IMPACT_ENABLED: 1
      GEOPOLITICAL_IMPACT_ENABLED: 1

      COMMODITY_FUNDAMENTALS_ENABLED: 1
      MARKET_REGIME_ENABLED: 1
      CROSS_COMMODITY_ANALYSIS_ENABLED: 1
      VOLATILITY_CONTEXT_ENABLED: 1

      # --------------------------------------------------
      # FUTURES / FUNDAMENTALS
      # --------------------------------------------------
      FUTURES_STRUCTURE_ENABLED: 1
      CFTC_ENABLED: 1
      EIA_ENABLED: 1

      # --------------------------------------------------
      # WEATHER / EVENTS
      # --------------------------------------------------
      WEATHER_ENABLED: 1
      DISASTER_ENABLED: 1
      SOLE24_ENABLED: 1
      EARLY_OPPORTUNITY_ENABLED: 1

      # --------------------------------------------------
      # SCALPING
      # --------------------------------------------------
      SCALPING_ENABLED: 1

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # PYTHON
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy feedparser

      # --------------------------------------------------
      # VERIFY FILE
      # --------------------------------------------------
      - name: Verify bot source
        run: |
          echo "Repository:"
          pwd
          echo ""
          echo "Files:"
          ls -lah
          echo ""
          test -f commodity_bot_v6.1.6_SOYUZ_GAGARIN_AUTONOMOUS.py

      # --------------------------------------------------
      # INSTALL BOT
      # --------------------------------------------------
      - name: Install bot
        run: |
          cp commodity_bot_v6.1.6_SOYUZ_GAGARIN_AUTONOMOUS.py commodity_bot.py
          ls -lh commodity_bot.py

      # --------------------------------------------------
      # COMPILE CHECK
      # --------------------------------------------------
      - name: Python compile check
        run: |
          python -m py_compile commodity_bot.py

      # --------------------------------------------------
      # RUN
      # --------------------------------------------------
      - name: Run Commodities Bot
        run: |
          python commodity_bot.py