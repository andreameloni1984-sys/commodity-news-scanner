name: Disabled legacy Telegram polling listener

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain that Render webhook owns Telegram updates
        run: |
          echo "Legacy long-polling listener intentionally disabled."
          echo "It called deleteWebhook and conflicted with the Render webhook."
          echo "Use the Render webhook service; do not start a second getUpdates consumer."
