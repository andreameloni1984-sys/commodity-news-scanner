name: SOYUZ Telegram Listener

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-listener:
    name: Telegram Long Polling
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ENABLED: "1"
      PAPER_TRADING_ONLY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Validate Telegram configuration
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "TELEGRAM_BOT_TOKEN MISSING"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "TELEGRAM_CHAT_ID MISSING"; exit 1; }
          echo "Telegram configuration present"
          echo "PAPER_TRADING_ONLY=$PAPER_TRADING_ONLY"

      - name: Test Telegram API
        run: |
          echo "Testing Telegram bot token..."
          RESPONSE=$(curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || {
            echo "Telegram API authentication failed."
            exit 1
          }
          echo "Telegram API authentication OK"

      - name: Start Telegram listener
        run: |
          python -u -m telegram.telegram_listener
