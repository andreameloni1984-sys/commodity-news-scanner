name: Gagarin - test Trading 212 Invest DEMO (sola lettura)
on:
  push:
    branches: [claude/commodities-analysis-bot-chat-cywpjt]
    paths: [".github/workflows/t212-demo-check.yml", "cfdbot/t212_demo_check.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      T212_API_KEY: ${{ secrets.T212_API_KEY || secrets.GAGARIN_DEMO_KEY || secrets.TRADING212_DEMO_API_KEY }}
      T212_API_SECRET: ${{ secrets.T212_API_SECRET || secrets.GAGARIN_DEMO_SECRET || secrets.TRADING212_DEMO_API_SECRET }}
      T212_KEY_SOURCE: ${{ secrets.T212_API_KEY != '' && 'T212_API_KEY' || secrets.GAGARIN_DEMO_KEY != '' && 'GAGARIN_DEMO_KEY' || secrets.TRADING212_DEMO_API_KEY != '' && 'TRADING212_DEMO_API_KEY' || 'nessuno' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python -m cfdbot.t212_demo_check
