name: FETCH DRIVERS

on:
  schedule:
    # ogni giorno alle 08:00 ora di Roma (07:00 UTC in inverno, 06:00 in estate)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: FETCH COMMODITY DRIVERS
    runs-on: ubuntu-latest
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY}}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch drivers
        run: python engine/fetch_drivers.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/driver_snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to driver_snapshot.json"
          else
            git commit -m "chore: update driver snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
